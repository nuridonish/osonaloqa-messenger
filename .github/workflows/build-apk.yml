name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure debug keystore (доимӣ — барои навсозии бе login)
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Oson Aloqa Debug" -keyalg RSA -keysize 2048 -validity 10000
            git config user.name "ci-bot"
            git config user.email "ci@osonaloqa.tj"
            git add android/app/debug.keystore
            git commit -m "debug keystore (доимӣ)" || echo "already"
            git push
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osonaloqa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
